# Plesk: app.fmtrx.com > Apache & nginx Settings > Additional nginx directives.
# Paste this block there (or include this file inside the site's server block).
# Inherit the site's existing document root, which must contain build/assets/.
# Do not add a second block if this location already exists: merge its directives.
# Validate with nginx -t before reloading nginx. Save the previous settings first.
# Only versioned Vite assets receive immutable caching; HTML/API responses do not.
location ^~ /build/assets/ {
    try_files $uri =404;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
# Verify after applying:
# curl -sSI -H 'Accept-Encoding: gzip' https://app.fmtrx.com/build/assets/<current-file>.js
# Expect Content-Encoding: gzip, Vary: Accept-Encoding and Cache-Control above.
# Rollback: remove this added block, nginx -t, then reload nginx.
