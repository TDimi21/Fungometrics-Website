name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (build + unit tests)
    runs-on: ubuntu-latest
    env:
      # Required by EnvironmentPlugin in vite.config; value is irrelevant for a build check.
      API_ENDPOINT: https://app.fmtrx.com/api/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Build (catches compile errors)
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test

  backend:
    timeout-minutes: 20
    name: Backend (PHP tests, MariaDB ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ['10.1.48', '10.6']
    services:
      mariadb:
        # Pin this to your production MariaDB version to catch engine-specific
        # DDL issues (e.g. the json column that failed on prod) before deploy.
        image: mariadb:${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fungo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fungo_test
      APP_ENV: testing
      TEST_DATABASE_ALLOWLIST: fungo_test
      MAIL_MAILER: array
      FMTRX_COMMUNICATIONS_ENABLED: 'false'
      FMTRX_COMMUNICATIONS_SEND_ENABLED: 'false'
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, pdo, pdo_mysql, bcmath, fileinfo, gd, zip, intl, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run migrations against MariaDB
        run: php artisan migrate --force
      - name: Full PHP regression suite (isolated test database)
        run: php -d memory_limit=512M vendor/bin/phpunit
